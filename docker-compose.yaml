services:
  postgres:
    image: postgres:17
    container_name: arcane-emporium-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d arcane_emporium"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: